<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="The Duʿāʾ of the Prophets">
  <!--
    The mark is the site's own timeline element, isolated: a ruled column with a
    single rubric point on it. It is not a mosque, a lantern, a crescent or a
    geometric pattern tile — those are the decorations that get reached for when
    a mark has nothing to say. This one says what the site is: a sequence, and a
    place in it.
  -->
  <rect width="64" height="64" fill="#e8e6df"/>
  <line x1="22" y1="10" x2="22" y2="54" stroke="#c9c6bc" stroke-width="1.5"/>
  <circle cx="22" cy="32" r="5" fill="#7e3b2e"/>
  <line x1="34" y1="26" x2="52" y2="26" stroke="#1b1e1c" stroke-width="2.5"/>
  <line x1="34" y1="34" x2="47" y2="34" stroke="#1b1e1c" stroke-width="2.5"/>
  <line x1="34" y1="42" x2="50" y2="42" stroke="#4e534e" stroke-width="1.5"/>
</svg>
